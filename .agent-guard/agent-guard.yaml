# Schema: coilysiren/agentic-os-kai#420 (tracker).
catalog:
  kind: Component
  type: library
  system: coily-platform
  owner: kai
  lifecycle: production
  description: "Security-boundary framework for urfave/cli v3 apps. Argv validation, audit log, scope tokens, lockdown writer with driver pattern."
  dependsOn: []
  providesApis:
    - cli-guard-go-pkg

commands:
  build:
    run: make build
    description: Build all packages.
  test:
    run: make test
    description: Run the unit test suite.
  vet:
    run: make vet
    description: go vet across the tree.
  lint:
    run: make lint
    description: Lint with golangci-lint.
  tidy:
    run: make tidy
    description: go mod tidy.
  cover:
    run: make cover
    description: Unit tests with a coverage profile.
  docs:
    run: make docs
    description: Build the mkdocs site into ./site.
  docs-cli:
    run: make docs-cli
    description: Overlay the per-example CLI reference under site/cli/ via cli-web-docs.
  docs-serve:
    run: make docs-serve
    description: Serve mkdocs locally with live reload on 127.0.0.1:8000.
  godoc-update:
    run: make godoc-update
    description: Regenerate godoc-current.txt; commit the diff to land API changes.
