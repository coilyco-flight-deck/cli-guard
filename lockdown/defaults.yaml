# Canonical Claude Code permission rules that coily lockdown writes into a
# repo's .claude/settings.json. The deny list maps 1:1 to the binaries coily
# wraps: bare invocation is denied so the agent is forced through
# `coily pkg <pkgmgr>` / `coily ops <bin>` / `coily docker` /
# `coily tailscale`. The audit log + argv validation become the system of
# record for every wrapped call.
#
# Things coily does not wrap (helm, terraform, scripting interpreters,
# shells, Windows execution vectors) are not denied here. They fall back to
# Claude Code's auto-mode classifier, same as bare `rm`. Defense-in-depth
# at the prefix layer is not free: every entry here is also an entry the
# hook renders into the per-repo PreToolUse script, and the cost of an
# overbroad deny is dead allowlist entries piling up across the catalog
# (the symptom that prompted this rewrite). See cli-guard#13, #14.
#
# This file is embedded into the coily binary at build time. Changes require
# editing here, rebuilding, and sudo-installing. Same review gate as any code
# change.

allow:
  # coily itself is the kernel boundary.
  - Bash(coily:*)

  # Filesystem + search (read-only).
  - Bash(ls:*)
  - Bash(cat:*)
  - Bash(head:*)
  - Bash(tail:*)
  - Bash(wc:*)
  - Bash(file:*)
  - Bash(stat:*)
  - Bash(grep:*)
  - Bash(rg:*)
  - Bash(find:*)
  - Bash(tree:*)

  # Pure non-shell evaluators. Same safety class as grep/rg: argv is a
  # query expression in the binary's own DSL, no shell-out, no user-
  # controlled command execution.
  - Bash(jq:*)
  - Bash(yq:*)

  # git, full surface. Destructive shapes (reset --hard, clean -fd,
  # push --force) are denied below; everything else is operator-trusted
  # per Kai's git workflow (commit-to-main, no PRs unless asked).
  - Bash(git:*)

deny:
  # Package managers. Wrapped by `coily pkg <pkgmgr>` so every
  # install/add/remove/run lands in the audit log with argv validation.
  - Bash(npm:*)
  - Bash(pnpm:*)
  - Bash(yarn:*)
  - Bash(bun:*)
  - Bash(uv:*)
  - Bash(pip:*)
  - Bash(pipx:*)
  - Bash(poetry:*)
  - Bash(cargo:*)
  - Bash(gem:*)
  - Bash(bundle:*)
  - Bash(nix:*)
  - Bash(brew:*)
  - Bash(scoop:*)

  # Privileged-op binaries. Wrapped by `coily ops <bin>`.
  - Bash(aws:*)
  - Bash(gh:*)
  - Bash(kubectl:*)
  - Bash(flyctl:*)
  - Bash(gcloud:*)
  - Bash(mcporter:*)

  # Top-level coily wrappers. Each has a dedicated `coily <bin>` verb
  # at the umbrella layer (not under ops).
  - Bash(docker:*)
  - Bash(tailscale:*)

  # ssh has no coily wrapper: the SSH transport and the `coily ssh`
  # passthrough were removed. Bare ssh stays denied with no recovery path.
  - Bash(ssh:*)

  # git destructive shapes. Workflow-forbidden per agentic-os-kai/AGENTS.md
  # ("Force-push is off-limits; amend pre-push only"). Allow above covers
  # the read + non-destructive write surface.
  - Bash(git reset --hard:*)
  - Bash(git clean -fd:*)
  - Bash(git push --force:*)
  - Bash(git push -f:*)

  # git config-injection RCE (cli-guard#84). `git -c <key>=<value>` sets
  # an arbitrary config knob for one invocation, and several knobs run a
  # command: core.sshCommand, core.fsmonitor, core.pager, alias.*=!sh.
  # This leading-token deny catches the common top-level form at the
  # built-in matcher (the primary CLI gate); the rendered hook adds a
  # content scan that also catches --config-env / --exec-path= and the
  # positional --upload-pack / --receive-pack remote-exec flags. The
  # Bash(git:*) allow above would otherwise auto-approve all of these.
  - Bash(git -c:*)
