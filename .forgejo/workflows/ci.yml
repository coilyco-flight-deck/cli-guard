# Forgejo-canonical CI gate. Mirrors the pre-commit suite (vet, build, test,
# golangci-lint, godoc-current, go mod tidy, secret scan) so the gate is enforced
# on the canonical remote inside the pinned dev-base image. The GitHub mirror's
# .github/workflows/ci.yml stays the PR-gated twin.
#
# The pinned dev-base image already carries Go, golangci-lint, and trufflehog,
# so the jobs run the same toolchain a dispatched agent lands in. Pin the image
# deliberately, never :latest.

name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: docker
    container: forgejo.coilysiren.me/coilyco-flight-deck/agentic-os:v0.195.0
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: go vet
        run: go vet ./...
      - name: go build
        run: go build ./...
      - name: go test
        run: go test -race -count=1 ./...
      - name: godoc-current.txt up to date
        run: ./scripts/check-godoc-current.sh
      - name: go.mod tidy
        run: |
          set -euo pipefail
          go mod tidy
          git diff --exit-code -- go.mod go.sum

  lint:
    runs-on: docker
    container: forgejo.coilysiren.me/coilyco-flight-deck/agentic-os:v0.195.0
    steps:
      - uses: actions/checkout@v6
      - name: golangci-lint
        run: golangci-lint run --timeout=5m ./...

  secrets:
    runs-on: docker
    container: forgejo.coilysiren.me/coilyco-flight-deck/agentic-os:v0.195.0
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan filesystem for secrets
        run: |
          set -euo pipefail
          printf '(^|/)\\.git/\n' > /tmp/trufflehog-exclude
          trufflehog filesystem . \
            --no-verification --no-update --fail \
            --exclude-paths=/tmp/trufflehog-exclude
