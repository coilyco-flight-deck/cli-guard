# Stage 1 of the two-stage release flow (ward#1117): every main push re-runs
# the full repo gate here (the same suite ci.yml enforces: vet, build, race
# test, godoc-current, mod tidy, golangci-lint, secret scan), publishes the
# commit-scoped draft tag (`draft-${sha}`), and only then fast-forwards
# `release` to that sha. release.yml then runs on the `release` push (stage 2:
# no re-gate, verify the draft tag, cut the Forgejo release) under a no-cancel
# concurrency queue. main stays the integration branch; `release` is
# last-known-good. Bursts on main collapse to the newest sha
# (cancel-in-progress: true - promotion is idempotent and a newer gate
# supersedes an older one). The promote push uses CI_RELEASE_TOKEN (real-user
# PAT with write:repository + read:user from SSM /forgejo/ci-release-token):
# job-token pushes and PATs without read:user are recorded with an empty actor
# and silently enqueue no workflow, which is how releases go missing. The
# checkout sets persist-credentials: false because checkout otherwise stores
# the job token as an http extraheader in the local git config, and that
# Authorization header overrides the PAT in the promote push URL - the push
# then lands as the internal Actions user, whose pushes Forgejo deliberately
# never enqueues workflows for. With it off, the push authenticates as the
# PAT user and stage 2 fires (ward#1117).

name: promote

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: promote-main
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  gate-and-promote:
    runs-on: docker
    timeout-minutes: 15
    container:
      image: forgejo.coilysiren.me/coilyco-flight-deck/agentic-os:release
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go test
        run: go test -race -count=1 ./...

      - name: godoc-current.txt up to date
        run: ./scripts/check-godoc-current.sh

      - name: go.mod tidy
        run: |
          set -euo pipefail
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: golangci-lint
        timeout-minutes: 5
        run: golangci-lint run --timeout=5m ./...

      - name: Scan filesystem for secrets
        run: |
          set -euo pipefail
          printf '(^|/)\\.git/\n' > /tmp/trufflehog-exclude
          trufflehog filesystem . \
            --no-verification --no-update --fail \
            --exclude-paths=/tmp/trufflehog-exclude

      - name: Publish draft release tag
        env:
          PROMOTE_TOKEN: ${{ secrets.CI_RELEASE_TOKEN }}
          REPO: ${{ github.repository }}
          SERVER: ${{ github.server_url }}
        run: |
          set -euo pipefail
          if [ -z "${PROMOTE_TOKEN:-}" ]; then
            echo "::error::CI_RELEASE_TOKEN not set; draft release publishing needs a real-user PAT so the release push enqueues release.yml (SSM /forgejo/ci-release-token, ward exec sync-actions-secrets in aos)." >&2
            exit 1
          fi
          # server_url resolves to the in-cluster http URL on this runner, so
          # keep its scheme instead of assuming https.
          proto="${SERVER%%://*}"
          host="${SERVER#*://}"
          remote_url="${proto}://oauth2:${PROMOTE_TOKEN}@${host}/${REPO}.git"
          draft_tag="draft-${GITHUB_SHA}"
          if git ls-remote --exit-code --tags "${remote_url}" "refs/tags/${draft_tag}" >/dev/null 2>&1; then
            echo "draft tag already published: ${draft_tag}"
            exit 0
          fi
          git tag "${draft_tag}"
          git push "${remote_url}" "refs/tags/${draft_tag}"
          echo "published ${draft_tag}"

      - name: Promote main to release (fast-forward only)
        env:
          PROMOTE_TOKEN: ${{ secrets.CI_RELEASE_TOKEN }}
          REPO: ${{ github.repository }}
          SERVER: ${{ github.server_url }}
        run: |
          set -euo pipefail
          if [ -z "${PROMOTE_TOKEN:-}" ]; then
            echo "::error::CI_RELEASE_TOKEN not set; promotion needs a real-user PAT so the release push enqueues release.yml (SSM /forgejo/ci-release-token, ward exec sync-actions-secrets in aos)." >&2
            exit 1
          fi
          # server_url resolves to the in-cluster http URL on this runner, so
          # keep its scheme instead of assuming https.
          proto="${SERVER%%://*}"
          host="${SERVER#*://}"
          # Plain push: git refuses a non-fast-forward, so a diverged release
          # branch fails loud here instead of being silently rewritten.
          git push "${proto}://oauth2:${PROMOTE_TOKEN}@${host}/${REPO}.git" HEAD:release
          echo "promoted $(git rev-parse --short HEAD) to release"

      - name: Alert Telegram on main failure
        if: ${{ failure() && github.ref == 'refs/heads/main' }}
        continue-on-error: true
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_RED_CHAT_ID }}
          REPO: ${{ github.repository }}
          WORKFLOW: ${{ github.workflow }}
          JOB: ${{ github.job }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          API_BASE: https://api.telegram.org
        run: "python3 -c 'exec(\"import os\\nimport sys\\nimport urllib.error\\nimport urllib.parse\\nimport urllib.request\\n\\ndef build_message():\\n    return \\\"\\\\n\\\".join([\\n        \\\"CI failed on main\\\",\\n        f\\\"repo: {os.environ['\"'\"'REPO'\"'\"']}\\\",\\n        f\\\"workflow: {os.environ['\"'\"'WORKFLOW'\"'\"']}\\\",\\n        f\\\"job: {os.environ['\"'\"'JOB'\"'\"']}\\\",\\n        f\\\"ref: {os.environ['\"'\"'REF'\"'\"']}\\\",\\n        f\\\"sha: {os.environ['\"'\"'SHA'\"'\"']}\\\",\\n        f\\\"run: {os.environ['\"'\"'RUN_URL'\"'\"']}\\\",\\n    ])\\n\\ndef main():\\n    bot_token = os.environ.get(\\\"BOT_TOKEN\\\", \\\"\\\")\\n    chat_id = os.environ.get(\\\"CHAT_ID\\\", \\\"\\\")\\n    if not bot_token or not chat_id:\\n        print(\\\"telegram alert missing required secret\\\", file=sys.stderr)\\n        return 2\\n    proxy_url = os.environ.get(\\\"FORGEJO_EGRESS_PROXY\\\", \\\"\\\").strip()\\n    payload = urllib.parse.urlencode(\\n        {\\n            \\\"chat_id\\\": chat_id,\\n            \\\"text\\\": build_message(),\\n            \\\"disable_web_page_preview\\\": \\\"true\\\",\\n        }\\n    ).encode(\\\"utf-8\\\")\\n    api_base = os.environ.get(\\\"API_BASE\\\", \\\"https://api.telegram.org\\\").rstrip(\\\"/\\\")\\n    request = urllib.request.Request(\\n        f\\\"{api_base}/bot{bot_token}/sendMessage\\\",\\n        data=payload,\\n        method=\\\"POST\\\",\\n    )\\n    opener = urllib.request.build_opener(\\n        urllib.request.ProxyHandler({\\\"https\\\": proxy_url})\\n        if proxy_url\\n        else urllib.request.ProxyHandler()\\n    )\\n    try:\\n        with opener.open(request, timeout=15) as response:\\n            response.read()\\n    except urllib.error.URLError as exc:\\n        print(f\\\"telegram alert failed ({type(exc).__name__})\\\", file=sys.stderr)\\n        return 1\\n    return 0\\n\\nraise SystemExit(main())\\n\")'"
