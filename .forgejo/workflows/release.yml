# Stage 2 of the two-stage release flow (ward#1117): promote.yml gates every
# main push, publishes the commit-scoped draft tag (`draft-${sha}`), and then
# fast-forwards `release` when green; this pipeline runs on `release` pushes
# only, under a concurrency queue (cancel-in-progress: false) so promoted
# shas release in sequence instead of overlap-and-cancel. A workflow_dispatch
# re-fires it against the `release` ref on a missed enqueue. There is no test
# job here: promote.yml already ran the full repo gate on the exact sha it
# fast-forwarded, so re-running the suite on `release` only lets a flaky rerun
# fail an already-vouched promotion (Kai's call, 2026-07-12).

name: release

on:
  push:
    branches: [release]
  workflow_dispatch:

concurrency:
  group: release-pipeline
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: docker
    container: forgejo.coilysiren.me/coilyco-flight-deck/agentic-os:release
    outputs:
      tag: ${{ steps.tag.outputs.new_tag }}
      version: ${{ steps.tag.outputs.new_version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - id: draft
        name: Derive the draft release tag
        run: |
          set -euo pipefail
          echo "draft_tag=draft-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Verify the draft release tag was published on main
        run: |
          set -euo pipefail
          git fetch --tags --force
          git rev-parse --verify "refs/tags/${{ steps.draft.outputs.draft_tag }}" >/dev/null
          echo "verified ${{ steps.draft.outputs.draft_tag }}"

      - id: tag
        uses: coilysiren/agentic-os/actions/tag-bump@main

      - name: Build packaged specgen CLI and package metadata
        if: ${{ steps.tag.outputs.new_tag != '' }}
        run: |
          make release-artifacts VERSION="${{ steps.tag.outputs.new_tag }}" DIST_DIR=dist
          make release-package VERSION="${{ steps.tag.outputs.new_tag }}" DIST_DIR=dist
          make release-check VERSION="${{ steps.tag.outputs.new_tag }}" DIST_DIR=dist

      - id: create
        if: ${{ steps.tag.outputs.new_tag != '' }}
        uses: coilysiren/agentic-os/actions/create-release@main
        with:
          tag: ${{ steps.tag.outputs.new_tag }}
          name: ${{ steps.tag.outputs.new_tag }}
          body: ${{ steps.tag.outputs.changelog }}

      - name: Upload specgen-linux-amd64
        if: ${{ steps.tag.outputs.new_tag != '' }}
        uses: coilysiren/agentic-os/actions/upload-release-asset@main
        with:
          release_id: ${{ steps.create.outputs.release_id }}
          file: dist/specgen-linux-amd64

      - name: Upload specgen-linux-arm64
        if: ${{ steps.tag.outputs.new_tag != '' }}
        uses: coilysiren/agentic-os/actions/upload-release-asset@main
        with:
          release_id: ${{ steps.create.outputs.release_id }}
          file: dist/specgen-linux-arm64

      - name: Upload specgen-darwin-amd64
        if: ${{ steps.tag.outputs.new_tag != '' }}
        uses: coilysiren/agentic-os/actions/upload-release-asset@main
        with:
          release_id: ${{ steps.create.outputs.release_id }}
          file: dist/specgen-darwin-amd64

      - name: Upload specgen-darwin-arm64
        if: ${{ steps.tag.outputs.new_tag != '' }}
        uses: coilysiren/agentic-os/actions/upload-release-asset@main
        with:
          release_id: ${{ steps.create.outputs.release_id }}
          file: dist/specgen-darwin-arm64

      - name: Upload specgen-windows-amd64
        if: ${{ steps.tag.outputs.new_tag != '' }}
        uses: coilysiren/agentic-os/actions/upload-release-asset@main
        with:
          release_id: ${{ steps.create.outputs.release_id }}
          file: dist/specgen-windows-amd64.exe

      - name: Upload specgen-windows-arm64
        if: ${{ steps.tag.outputs.new_tag != '' }}
        uses: coilysiren/agentic-os/actions/upload-release-asset@main
        with:
          release_id: ${{ steps.create.outputs.release_id }}
          file: dist/specgen-windows-arm64.exe

      - name: Upload SHA256SUMS
        if: ${{ steps.tag.outputs.new_tag != '' }}
        uses: coilysiren/agentic-os/actions/upload-release-asset@main
        with:
          release_id: ${{ steps.create.outputs.release_id }}
          file: dist/SHA256SUMS

      - name: Upload specgen Homebrew formula
        if: ${{ steps.tag.outputs.new_tag != '' }}
        uses: coilysiren/agentic-os/actions/upload-release-asset@main
        with:
          release_id: ${{ steps.create.outputs.release_id }}
          file: dist/specgen.rb

      - name: Upload specgen Scoop manifest
        if: ${{ steps.tag.outputs.new_tag != '' }}
        uses: coilysiren/agentic-os/actions/upload-release-asset@main
        with:
          release_id: ${{ steps.create.outputs.release_id }}
          file: dist/specgen.json

      - name: Update the Homebrew tap
        if: ${{ steps.tag.outputs.new_tag != '' }}
        env:
          TAP_WRITE_TOKEN: ${{ secrets.TAP_WRITE_TOKEN }}
          TAG: ${{ steps.tag.outputs.new_tag }}
        run: |
          set -euo pipefail
          if [ -z "${TAP_WRITE_TOKEN:-}" ]; then
            echo "::warning::TAP_WRITE_TOKEN is absent; skipping Homebrew update" >&2
            exit 0
          fi
          git clone --depth 1 \
            https://forgejo.coilysiren.me/coilyco-flight-deck/homebrew-tap.git tap
          cp dist/specgen.rb tap/Formula/specgen.rb
          cd tap
          git add Formula/specgen.rb
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "coilyco-ops"
          git config user.email "coilyco-ops@coilysiren.me"
          git commit -m "chore(specgen): bump formula to ${TAG} [skip ci]"
          git push \
            "https://coilyco-ops:${TAP_WRITE_TOKEN}@forgejo.coilysiren.me/coilyco-flight-deck/homebrew-tap.git" \
            HEAD:main

      - name: Update the Scoop bucket
        if: ${{ steps.tag.outputs.new_tag != '' }}
        env:
          SCOOP_WRITE_TOKEN: ${{ secrets.SCOOP_WRITE_TOKEN }}
          TAG: ${{ steps.tag.outputs.new_tag }}
        run: |
          set -euo pipefail
          if [ -z "${SCOOP_WRITE_TOKEN:-}" ]; then
            echo "::warning::SCOOP_WRITE_TOKEN is absent; skipping Scoop update" >&2
            exit 0
          fi
          git clone --depth 1 \
            https://forgejo.coilysiren.me/coilyco-flight-deck/scoop-bucket.git bucket
          cp dist/specgen.json bucket/bucket/specgen.json
          cd bucket
          git add bucket/specgen.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "coilyco-ops"
          git config user.email "coilyco-ops@coilysiren.me"
          git commit -m "chore(specgen): bump manifest to ${TAG} [skip ci]"
          git push \
            "https://coilyco-ops:${SCOOP_WRITE_TOKEN}@forgejo.coilysiren.me/coilyco-flight-deck/scoop-bucket.git" \
            HEAD:main

      - name: Alert Telegram on release failure
        if: ${{ failure() && github.ref == 'refs/heads/release' }}
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_RED_CHAT_ID }}
          REPO: ${{ github.repository }}
          WORKFLOW: ${{ github.workflow }}
          JOB: ${{ github.job }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          API_BASE: https://api.telegram.org
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import urllib.error
          import urllib.parse
          import urllib.request

          def build_message(repo, workflow, job, ref, sha, run_url):
              return "\n".join([
                  "CI failed on release",
                  f"repo: {repo}",
                  f"workflow: {workflow}",
                  f"job: {job}",
                  f"ref: {ref}",
                  f"sha: {sha}",
                  f"run: {run_url}",
              ])

          def main():
              bot_token = os.environ["BOT_TOKEN"]
              chat_id = os.environ["CHAT_ID"]
              message = build_message(
                  os.environ["REPO"],
                  os.environ["WORKFLOW"],
                  os.environ["JOB"],
                  os.environ["REF"],
                  os.environ["SHA"],
                  os.environ["RUN_URL"],
              )
              payload = urllib.parse.urlencode(
                  {
                      "chat_id": chat_id,
                      "text": message,
                      "disable_web_page_preview": "true",
                  }
              ).encode("utf-8")
              url = f"{os.environ['API_BASE'].rstrip('/')}/bot{bot_token}/sendMessage"
              req = urllib.request.Request(url, data=payload, method="POST")
              try:
                  with urllib.request.urlopen(req, timeout=15) as resp:
                      resp.read()
              except urllib.error.URLError as exc:
                  print(f"telegram alert failed: {exc}")
                  raise SystemExit(1)

          main()
          PY
      - name: Alert Telegram on main failure
        if: ${{ failure() && github.ref == 'refs/heads/main' }}
        continue-on-error: true
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_RED_CHAT_ID }}
          REPO: ${{ github.repository }}
          WORKFLOW: ${{ github.workflow }}
          JOB: ${{ github.job }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          API_BASE: https://api.telegram.org
        run: "python3 -c 'exec(\"import os\\nimport sys\\nimport urllib.error\\nimport urllib.parse\\nimport urllib.request\\n\\ndef build_message():\\n    return \\\"\\\\n\\\".join([\\n        \\\"CI failed on main\\\",\\n        f\\\"repo: {os.environ['\"'\"'REPO'\"'\"']}\\\",\\n        f\\\"workflow: {os.environ['\"'\"'WORKFLOW'\"'\"']}\\\",\\n        f\\\"job: {os.environ['\"'\"'JOB'\"'\"']}\\\",\\n        f\\\"ref: {os.environ['\"'\"'REF'\"'\"']}\\\",\\n        f\\\"sha: {os.environ['\"'\"'SHA'\"'\"']}\\\",\\n        f\\\"run: {os.environ['\"'\"'RUN_URL'\"'\"']}\\\",\\n    ])\\n\\ndef main():\\n    bot_token = os.environ.get(\\\"BOT_TOKEN\\\", \\\"\\\")\\n    chat_id = os.environ.get(\\\"CHAT_ID\\\", \\\"\\\")\\n    if not bot_token or not chat_id:\\n        print(\\\"telegram alert missing required secret\\\", file=sys.stderr)\\n        return 2\\n    proxy_url = os.environ.get(\\\"FORGEJO_EGRESS_PROXY\\\", \\\"\\\").strip()\\n    payload = urllib.parse.urlencode(\\n        {\\n            \\\"chat_id\\\": chat_id,\\n            \\\"text\\\": build_message(),\\n            \\\"disable_web_page_preview\\\": \\\"true\\\",\\n        }\\n    ).encode(\\\"utf-8\\\")\\n    api_base = os.environ.get(\\\"API_BASE\\\", \\\"https://api.telegram.org\\\").rstrip(\\\"/\\\")\\n    request = urllib.request.Request(\\n        f\\\"{api_base}/bot{bot_token}/sendMessage\\\",\\n        data=payload,\\n        method=\\\"POST\\\",\\n    )\\n    opener = urllib.request.build_opener(\\n        urllib.request.ProxyHandler({\\\"https\\\": proxy_url})\\n        if proxy_url\\n        else urllib.request.ProxyHandler()\\n    )\\n    try:\\n        with opener.open(request, timeout=15) as response:\\n            response.read()\\n    except urllib.error.URLError as exc:\\n        print(f\\\"telegram alert failed ({type(exc).__name__})\\\", file=sys.stderr)\\n        return 1\\n    return 0\\n\\nraise SystemExit(main())\\n\")'"
