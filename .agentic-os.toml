# cli-guard is deliberately unguarded: it is the cli-guard framework itself,
# not a consumer of it. It carries no .ward/.coily catalog config and does not
# route dev verbs through a guard (dev verbs are plain `make`). Disable the
# catalog hooks that require a catalog config. See the cli-guard
# unguarding decision (structural validation of the consumer flow).

[catalog-block-present]
enabled = false

[catalog-trifecta]
enabled = false
