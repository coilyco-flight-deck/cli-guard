# cli-guard is deliberately unguarded: it is the cli-guard framework itself,
# not a consumer of it. It carries no .ward/.coily catalog config and does not
# route dev verbs through a guard (dev verbs are plain `make`). Disable the
# catalog hooks that require a catalog config. See the cli-guard
# unguarding decision (structural validation of the consumer flow).

[catalog-block-present]
enabled = false

[catalog-trifecta]
enabled = false

# The v0.11.1 code-comments 2-line cap conflicts with Go doc comments on
# exported symbols, which this repo deliberately maintains (godoc-current.txt
# is pinned). Grandfather the files carrying legacy multi-line doc comments so
# the guard stays on for everything else. Durable fix tracked in #72.
[code-comments]
excludes = [
  "allowlist/allowlist.go",
  "catalog/catalog.go",
  "cmd/cli-guard-hook/main.go",
  "hook/hook.go",
  "hookcfg/hookcfg.go",
  "repocfg/security.go",
]
