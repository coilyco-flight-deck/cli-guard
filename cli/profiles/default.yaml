# Per-host lockdown profile registry. Rationale: docs/profiles.md.

profiles:

  mobile:
    data_security: high
    blast_radius: medium
    network_egress: allowlisted
    filesystem_reach: repo-plus-home

  mac-tower:
    data_security: medium
    blast_radius: high
    network_egress: open
    filesystem_reach: unrestricted

  windows-laptop:
    data_security: medium
    blast_radius: medium
    network_egress: open
    filesystem_reach: repo-plus-home

  web:
    data_security: max
    blast_radius: low
    network_egress: allowlisted
    filesystem_reach: repo-only

  headless:
    data_security: max
    blast_radius: low
    network_egress: air-gapped
    filesystem_reach: repo-only
