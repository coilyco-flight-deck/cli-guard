# Permission rules the lockdown writer emits. Rationale: docs/lockdown-defaults.md.

allow:
  - Bash(ward:*)

  - Bash(ls:*)
  - Bash(cat:*)
  - Bash(head:*)
  - Bash(tail:*)
  - Bash(wc:*)
  - Bash(file:*)
  - Bash(stat:*)
  - Bash(grep:*)
  - Bash(rg:*)
  - Bash(find:*)
  - Bash(tree:*)

  - Bash(jq:*)
  - Bash(yq:*)

  - Bash(git:*)

deny:
  - Bash(npm:*)
  - Bash(pnpm:*)
  - Bash(yarn:*)
  - Bash(bun:*)
  - Bash(uv:*)
  - Bash(pip:*)
  - Bash(pipx:*)
  - Bash(poetry:*)
  - Bash(cargo:*)
  - Bash(gem:*)
  - Bash(bundle:*)
  - Bash(nix:*)
  - Bash(brew:*)
  - Bash(scoop:*)

  - Bash(aws:*)
  - Bash(gh:*)
  - Bash(kubectl:*)
  - Bash(flyctl:*)
  - Bash(gcloud:*)
  - Bash(mcporter:*)

  - Bash(docker:*)
  - Bash(tailscale:*)

  - Bash(ssh:*)

  - Bash(git reset --hard:*)
  - Bash(git clean -fd:*)
  - Bash(git push --force:*)
  - Bash(git push -f:*)

  - Bash(git -c:*)
